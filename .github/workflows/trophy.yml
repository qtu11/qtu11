name: Update GitHub Trophy

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  trophy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate trophy
        uses: soulteary/github-profile-trophy-action@v1.0.0
        with:
          options: "username=qtu11&theme=tokyonight&column=8&row=1&margin-w=8&no-bg=true&no-frame=true"
          path: assets/github-trophy.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit trophy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/github-trophy.svg

          git diff --cached --quiet || \
          git commit -m "chore: update GitHub trophies"

          git push
